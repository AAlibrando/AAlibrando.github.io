<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excersize 4</title>
    <style>
         body {
        margin: 0;
        padding: 0;
      }
      main {
        padding: 1em;
      }
      #toggle-nav-btn {
        display: none;
        position: absolute;
        right: 1em;
        top: 1em;
    }
    #primary-nav {
        background-color: rgb(213, 121, 23);
    }
    #primary-nav ul {
        padding-left: 0;
    }
    #primary-nav li {
        list-style: none;
        display: inline-block;
    }
    #primary-nav a {
        background-color: ivory;
        display: block;
        padding: 1em;
    }
    @media (max-width: 767px) {
        #primary-nav {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s ease-out;
        }
        #primary-nav li{
            display: block;
        }
        body.nav-open #primary-nav {
            grid-template-rows: 1fr;
        }
        .inner {
            overflow: hidden;
        }
        #toggle-nav-btn {
            display: block; /* display button beneath breakpoint */
        }
    }
</style>
</head>
<body>
    <nav id="primary-nav">
        <ul>
            <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
        </ul>
        </nav>
        <main>
            <p>hello</p>
     </main>
     <script>
        // Perform this after the window has loaded
      window.onload = () => {
        // First, tell JavaScript to remember which DOM element (in this case, a button) to reference (by id)
        const toggleNavBtn = document.getElementById("toggle-nav-btn");
        toggleNavBtn.innerHTML = "&#9776;";

        // Tell button to do something on click
        toggleNavBtn.addEventListener("click", () => {
          // toggle the body's class attribute
          document.body.classList.toggle("nav-open");
          toggleNavBtn.innerHTML = document.body.classList.contains("nav-open")
            ? "&#x2715"
            : "&#9776;";
        });
      };
        </script>
    </body>
</html>
