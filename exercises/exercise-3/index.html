<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 3</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <style>
      :root {
        --white: #dcdada;
        --boxBg: #fffbfb;
        --pageBg: #f8f8f8;
        --basePadding: 20px;
        --baseMargin: 5px;
        --headerBlue: #fdfefe;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--pageBg);
        font-family: Arial, sans-serif;
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0;
      }

      .site-header {
        display: flex;
        align-items: center;
        gap: 20px;
        background: var(--headerBlue);
        min-height: 110px;
        padding: 20px;
        border: 1px solid #ccc;
      }

      .square3 {
        width: 70px;
        height: 70px;
        background: #fff;
        border: 2px solid #ffffff;
        flex-shrink: 0;
      }

      .header-copy {
        flex: 1;
        text-align: center;
      }

      .layout {
        background: var(--white);
        padding: var(--basePadding);
        display: grid;
        gap: var(--basePadding);
      }

      .row {
        display: flex;
        gap: var(--basePadding);
      }

      .col-a,
      .col-b,
      .col-50,
      .col-33,
      .col-100 {
        background: var(--boxBg);
        border: 1px solid #d7d7d7;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .col-a {
        flex: 1;
      }

      .col-b {
        width: 200px;
        flex-shrink: 0;
      }

      .col-50 {
        flex: 1;
      }

      .col-33 {
        flex: 1;
      }

      .col-100 {
        width: 100%;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="square3"></div>
        <div class="header-copy">
          <div>Exercise 3</div>
          <div>header: col-100</div>
          <div>This entire layout is 1440px wide</div>
        </div>
      </header>

      <main class="layout">
        <div class="row">
          <div class="col-a">col-a</div>
          <div class="col-b">col-b<br />(width 200px)</div>
        </div>

        <div class="row">
          <div class="col-50">col-50</div>
          <div class="col-50">col-50</div>
        </div>

        <div class="row">
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
          <div class="col-33">col-33</div>
        </div>

        <div class="row">
          <div class="col-100">footer: col-100</div>
        </div>
      </main>
    </div>
  </body>
</html>
